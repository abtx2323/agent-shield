version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "test"
  # Keeps the pinned tailwindcss build dependency up to date
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    target-branch: "test"
